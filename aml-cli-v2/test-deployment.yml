parameters:
  - name: deployment_name
    type: string
  - name: sample_request
    type: string
  - name: request_type
    type: string

steps:
  - task: AzureCLI@2
    displayName: Test deployment
    inputs:
      azureSubscription: $(ado_service_connection_rg)
      scriptType: bash
      workingDirectory: $(System.DefaultWorkingDirectory)
      scriptLocation: inlineScript
      inlineScript: |
        set -e

        RESPONSE=$(az ml $(endpoint_type)-endpoint invoke \
          --name $(endpoint_name) \
          --deployment-name ${{ parameters.deployment_name }} \
          --request-file ${{ parameters.sample_request }} \
          --resource-group $(resource_group) \
          --workspace-name $(aml_workspace))

        echo $RESPONSE
    condition: and(succeeded(), eq(variables['endpoint_type'], 'online'))

  - task: AzureCLI@2
    displayName: Test deployment
    inputs:
      azureSubscription: $(ado_service_connection_rg)
      scriptType: bash
      workingDirectory: $(System.DefaultWorkingDirectory)
      scriptLocation: inlineScript
      inlineScript: |
        set -e

        JOB_NAME=$(az ml $(endpoint_type)-endpoint invoke \
          --name $(endpoint_name) \
          --deployment-name ${{ parameters.deployment_name }} \
          --input ${{ parameters.sample_request }} \
          --input-type ${{ parameters.request_type }} \
          --resource-group $(resource_group) \
          --workspace-name $(aml_workspace) \
          --query name -o tsv)

        az ml job show \
          --name $JOB_NAME \
          --resource-group $(resource_group) \
          --workspace-name $(aml_workspace) \
          --web

        az ml job stream \
          --name $JOB_NAME \
          --resource-group $(resource_group) \
          --workspace-name $(aml_workspace)

        STATUS=$(az ml job show \
          --name $JOB_NAME \
          --resource-group $(resource_group) \
          --workspace-name $(aml_workspace) \
          --query status -o tsv)

        echo $STATUS

        if [[ $STATUS == "Completed" ]]
        then
          echo "Job completed"
        elif [[ $STATUS == "Failed" ]]
        then
          echo "Job failed"
          exit 1
        else
          echo "Job status not failed or completed"
          exit 2
        fi
    condition: and(succeeded(), eq(variables['endpoint_type'], 'batch'))