parameters:
- name: endpoint_file
  type: string

steps:
  - task: AzureCLI@2
    displayName: Create online/batch endpoint
    continueOnError: true
    inputs:
      azureSubscription: $(ado_service_connection_rg)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |

        ENDPOINT_EXISTS=$(az ml $(endpoint_type)-endpoint list \
          --resource-group $(resource_group) \
          --workspace-name $(aml_workspace) \
          -o tsv \
          --query "[?name=='$(endpoint_name)'][name]" | wc -l)

        echo "$(endpoint_name) $ENDPOINT_EXISTS"

        az ml $(endpoint_type)-endpoint list \
          --resource-group $(resource_group) \
          --workspace-name $(aml_workspace) \
          -o tsv

        if [[ $ENDPOINT_EXISTS -ne 1 ]]; then

            az ml $(endpoint_type)-endpoint create \
              --name $(endpoint_name) \
              --file ${{ parameters.endpoint_file }} \
              --resource-group $(resource_group) \
              --workspace-name $(aml_workspace)

        else
            echo "Endpoint exists"
        fi