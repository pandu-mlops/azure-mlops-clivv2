parameters:
- name: cluster_name
  type: string
- name: size
  type: string
- name: min_instances
  type: number
- name: max_instances
  type: number
- name: cluster_tier
  type: string

steps:
  - task: AzureCLI@2
    displayName: Create compute cluster
    continueOnError: true
    inputs:
      azureSubscription: $(ado_service_connection_rg)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |

        echo "Resource Group : $(resource_group)"
        echo "Workspace Name : $(aml_workspace)"
        echo "Compute Name   : ${{ parameters.cluster_name }}"

        compute_name=$(az ml compute show \
          --name ${{ parameters.cluster_name }} \
          --resource-group $(resource_group) \
          --workspace-name $(aml_workspace) \
          --query name \
          -o tsv 2>/dev/null || true)

        if [[ -z "$compute_name" ]]
        then
          echo "Compute does not exist. Creating the cluster..."

          az ml compute create \
            --name ${{ parameters.cluster_name }} \
            --type amlcompute \
            --size ${{ parameters.size }} \
            --min-instances ${{ parameters.min_instances }} \
            --max-instances ${{ parameters.max_instances }} \
            --tier ${{ parameters.cluster_tier }} \
            --resource-group $(resource_group) \
            --workspace-name $(aml_workspace)

        else
          echo "Compute exists. Skipping cluster creation."
          exit 0
        fi